{% set version = "0.1.0" %}

package:
  name: annomerge
  version: {{ version }}

source:
  url: https://github.com/Steven-Stimson/annomerge/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 3810d56594654dfb982de6c83a11eda30514fc3587abe4e0bf3b977b3b2f3a4e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    # python deps (see pyproject.toml)
    - python >=3.10
    - typer >=0.9
    - pyyaml >=6.0
    - pysam >=0.22
    - jinja2 >=3.0
    # external tools (resolved from PATH at runtime; check with `annomerge -c`)
    - hisat2
    - samtools
    - stringtie
    - gffread
    - gffcompare
    - diamond
    - busco
    - miniprot
    # gold set / EVM integration (+ their perl module deps)
    - transdecoder
    - perl-uri
    - evidencemodeler
    - perl-dbi

test:
  commands:
    - annomerge -h
    - annomerge merge -h
    - annomerge evaluate -h
    - annomerge -c
  imports:
    - annomerge
    - annomerge.cli

about:
  home: https://github.com/Steven-Stimson/annomerge
  license: MIT
  license_file: LICENSE
  summary: "EVM weight calibration + evidence auditing for gene annotation in non-model organisms"
  description: |
    AnnoMerge has two subcommands with aligned arguments:
    - `annomerge merge`: de novo predictor scoring + EVM weight calibration,
      EVM integration, isoform resolution / UTR backfill, sanity repair,
      coverage-aware confidence tiers, HTML report and a single-file offline
      evidence browser.
    - `annomerge evaluate`: read-only assessment of an existing annotation
      with the same assessment chain (never filtered, renamed or
      coordinate-lifted).
    BUSCO lineage data (--busco) and OMAmer databases (--omark-db) are
    runtime inputs and intentionally not packaged.

extra:
  recipe-maintainers:
    - Steven-Stimson
