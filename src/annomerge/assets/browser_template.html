<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnnoMerge Evidence Browser (igv.js)</title>
<script src="js/igv.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
            background: #1f4e79; color: #fff; flex: 0 0 auto; flex-wrap: wrap; }
  #topbar h1 { font-size: 15px; font-weight: 600; margin-right: 8px; }
  #topbar select, #topbar input { padding: 4px 8px; border: none; border-radius: 4px; font-size: 13px; }
  #gene-search { width: 220px; }
  .chip { padding: 3px 10px; border-radius: 12px; font-size: 12px; cursor: pointer;
          background: rgba(255,255,255,.18); border: 1px solid transparent; user-select: none; }
  .chip.active { background: #fff; color: #1f4e79; font-weight: 600; }
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #sidebar { flex: 0 0 33.333%; border-right: 1px solid #ddd; display: flex;
             flex-direction: column; min-height: 0; }
  body.side-collapsed #sidebar { display: none; }
  #side-toggle { white-space: nowrap; }

  /* ---- top-left: gene list module ---- */
  #list-module { flex: 1 1 55%; display: flex; flex-direction: column;
                 min-height: 120px; border-bottom: 2px solid #ccc; }
  #list-head { flex: 0 0 auto; border-bottom: 1px solid #eee; }
  .list-title { padding: 8px 12px 4px; font-size: 13px; font-weight: 700; color: #444; }
  .flt-row { display: flex; align-items: center; gap: 6px; padding: 4px 10px 8px;
             flex-wrap: wrap; }
  .flt-row .chip { background: #e8eef5; color: #33506b; padding: 2px 9px; }
  .flt-row .chip.active { background: #1f4e79; color: #fff; }
  .flt-row select { padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px;
                    font-size: 12px; background: #fff; }
  #list-info { padding: 0 12px 6px; font-size: 11px; color: #888; }
  #gene-table { flex: 1 1 auto; overflow-y: auto; font-size: 12px; }
  #gene-table table { width: 100%; border-collapse: collapse; }
  #gene-table th { position: sticky; top: 0; background: #f5f5f5; padding: 6px 8px; text-align: left;
                   border-bottom: 1px solid #ddd; font-weight: 600; }
  #gene-table th select.col-flt { font-size: 11px; font-weight: 400; padding: 1px 2px;
                                  margin-left: 2px; border: 1px solid #ccc; border-radius: 3px;
                                  background: #fff; max-width: 92px; }
  #gene-table td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; white-space: nowrap; }
  #gene-table tr:hover td { background: #eaf2fa; }
  #gene-table tr.current td { background: #d6e6f5; }

  /* ---- bottom-left: gene detail module ---- */
  #detail-module { flex: 1 1 45%; display: flex; flex-direction: column; min-height: 100px; }
  #detail-head { flex: 0 0 auto; padding: 8px 12px 4px; font-size: 13px; font-weight: 700;
                 color: #444; border-bottom: 1px solid #eee; }
  #gene-detail { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px; font-size: 12px;
                 color: #333; }
  .dt-section { margin-bottom: 10px; }
  .dt-title { font-size: 11px; font-weight: 700; color: #1f4e79; text-transform: uppercase;
              letter-spacing: .4px; margin-bottom: 4px; border-bottom: 1px dashed #d5e0ec;
              padding-bottom: 2px; }
  .dt-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .dt-grid .k { color: #777; white-space: nowrap; }
  .dt-grid .v { font-weight: 600; }
  .dt-empty { color: #999; font-style: italic; }
  .ev-bar { display: inline-block; height: 8px; border-radius: 4px; vertical-align: middle;
            margin-right: 6px; background: #9ecae1; }
  /* one de novo predictor per row */
  .ev-row { display: flex; align-items: center; gap: 8px; padding: 2px 0;
            white-space: nowrap; }
  .ev-row .ev-name { font-weight: 600; }
  .ev-row .ev-w { color: #888; font-size: 11px; }
  .ev-row .ev-val { margin-left: auto; font-weight: 700; }
  /* per-transcript cards */
  .tx-card { border: 1px solid #dfe7ef; border-radius: 6px; padding: 6px 8px;
             margin-bottom: 6px; background: #fafcfe; }
  .tx-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .tx-id { font-weight: 700; color: #1f4e79; }
  .tx-loc { color: #888; font-size: 11px; }
  .tx-grid { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 11px; }
  .tx-grid .k { color: #777; white-space: nowrap; }
  .tx-grid .v { font-weight: 600; }
  .tx-grid .dim { color: #999; font-weight: 400; }
  .warn-line { color: #c0392b; margin-top: 4px; }

  .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; color: #fff; }
  .b-strong { background: #1a7f37; } .b-moderate { background: #b8860b; } .b-weak { background: #c0392b; }
  .mb { display: inline-block; padding: 0 4px; border-radius: 6px; font-size: 10px; color: #fff;
        background: #777; margin-right: 2px; }
  .gs-yes { color: #1a7f37; font-weight: 700; } .gs-no { color: #bbb; }
  .score-low { color: #c0392b; font-weight: 700; }
  #igv-div { flex: 1 1 auto; min-width: 0; overflow-y: auto; }
  /* igv root (.igv-container) is height:auto and grows with total track height; scroll at this container */
  #igv-div .igv-container { height: auto; min-height: 100%; }
  /* igv collapses the navbar buttons (cursor guide / center guide / track
     labels / save SVG) below ~990px panel width — keep them always visible */
  #igv-div .igv-navbar-right-container [class^="igv-navbar-toggle-button-container"] {
    display: flex !important;
    flex-flow: row nowrap;
    align-items: center;
    height: 100%;
  }
  #status { flex: 0 0 auto; padding: 4px 12px; font-size: 12px; color: #888; border-top: 1px solid #eee; }
</style>
</head>
<body>
<div id="topbar">
  <span id="side-toggle" class="chip active" title="Collapse/expand gene list">&#9776; Hide gene list</span>
  <h1>AnnoMerge Evidence Browser</h1>
  <label>Gene: <input id="gene-search" list="gene-datalist" placeholder="Gene ID or locus, Enter to jump"></label>
  <datalist id="gene-datalist"></datalist>
  <span id="count-info" style="margin-left:auto;font-size:12px;"></span>
</div>
<div id="main">
  <div id="sidebar">
    <div id="list-module">
      <div id="list-head">
        <div class="list-title">Gene list</div>
        <div class="flt-row">
          <select id="flt-chr" title="Filter by chromosome"><option value="">All chromosomes</option></select>
          <select id="flt-sort" title="Sort gene list">
            <option value="gff">Sort: GFF order</option>
            <option value="name">Sort: name</option>
            <option value="coord">Sort: coordinate</option>
          </select>
          <select id="flt-dir" title="Sort direction">
            <option value="asc">&#8593; asc</option>
            <option value="desc">&#8595; desc</option>
          </select>
        </div>
        <div id="list-info"></div>
      </div>
      <div id="gene-table">
        <table>
          <thead><tr><th>Gene</th><th>Transcript</th>
            <th>Tier <select id="flt-tier" class="col-flt" title="Filter by tier">
              <option value="all">All</option>
              <option value="strong">strong</option>
              <option value="moderate">moderate</option>
              <option value="weak">weak</option>
            </select></th>
            <th>RNA <select id="flt-rna" class="col-flt" title="Filter by RNA support range">
              <option value="">all</option>
              <option value="hi">≥0.8</option>
              <option value="mid">0.5–0.8</option>
              <option value="lo">&lt;0.5</option>
            </select></th>
            <th>Protein <select id="flt-prot" class="col-flt" title="Filter by protein support range">
              <option value="">all</option>
              <option value="hi">≥0.8</option>
              <option value="mid">0.5–0.8</option>
              <option value="lo">&lt;0.5</option>
            </select></th>
            <th title="GoldSet origin">GoldSet <select id="flt-gold" class="col-flt" title="Filter by GoldSet origin">
              <option value="">all</option>
              <option value="yes">✓</option>
              <option value="no">no</option>
            </select></th></tr></thead>
          <tbody id="gene-tbody"></tbody>
        </table>
      </div>
    </div>
    <div id="detail-module">
      <div id="detail-head">Gene detail</div>
      <div id="gene-detail"><span class="dt-empty">Click a gene in the list above (or search) to see its structure and evidence support details.</span></div>
    </div>
  </div>
  <div id="igv-div"></div>
</div>
<div id="status">Loading igv.js and annotation data&hellip;</div>
<script>
const TIER_COLORS = __TIER_COLORS__;
const DEFAULT_COLOR = "#1f4e79";
let geneMap = new Map();   // gid -> gene record
let genes = [];
let browser = null;
let currentTier = "all";
let fltChr = "";
let fltRna = "";     // "" | hi (>=0.8) | mid (0.5-0.8) | lo (<0.5)
let fltProt = "";
let fltGold = "";    // "" | yes | no
let sortMode = "gff";
let sortDir = "asc";
let chromOrder = new Map();   // chrom name -> index in fai
let denovoMeta = [];          // [{pred, w, color}]
function setStatus(msg) { document.getElementById("status").textContent = msg; }
function gidNum(g) {
  const m = g.match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1], 10) : 0;
}
function tierColorFn(feature) {
  let id = null;
  try {
    if (feature.getAttributeValue) {
      id = feature.getAttributeValue("ID") || feature.getAttributeValue("Parent");
    }
    if (!id && feature.attribute) {
      id = feature.attribute.ID || feature.attribute.Parent;
    }
  } catch (e) { /* ignore */ }
  if (id) {
    const gid = String(id).replace(/\.\d+$/, "");
    const g = geneMap.get(gid);
    if (g && TIER_COLORS[g.tier]) return TIER_COLORS[g.tier];
  }
  return DEFAULT_COLOR;
}
const TRACKS_BEFORE = [
  { name: "AnnoMerge final annotation (colored by tier)", type: "annotation", format: "gff3",
    url: "data/final.gff3", color: tierColorFn, height: 220,
    displayMode: "EXPANDED", visibilityWindow: -1 }
];
// evidence tracks ordered by evidential weight: GoldSet > RNA coverage >
// transcript assembly > protein; de novo predictors appended last (by W).
// (the HISAT2 junction track was removed by design: it overlaps the RNA
// coverage/StringTie evidence and clutters the browser)
const TRACKS_EVIDENCE = [
  { name: "GoldSet (TransDecoder)", type: "annotation", format: "gff3",
    url: "data/goldset.gff3", color: "__GOLDSET_COLOR__", height: 120,
    visibilityWindow: -1 },
/*__COVERAGE_TRACK__*/
  { name: "Transcript Assembly (StringTie)", type: "annotation", format: "gtf",
    url: "data/stringtie.gtf", color: "__STRINGTIE_COLOR__", height: 160,
    displayMode: "EXPANDED", visibilityWindow: -1 },
/*__PROTEIN_TRACKS__*/
];
let denovoTracks = [];
let TRACKS = TRACKS_BEFORE.concat(TRACKS_EVIDENCE);
async function loadDenovoTracks() {
  // tracks.json: denovo predictors auto-generated from run params + scoring, sorted by W desc
  const resp = await fetch("data/tracks.json");
  const cfg = await resp.json();
  denovoMeta = cfg.denovo || [];
  denovoTracks = denovoMeta.map(d => ({
    name: `de novo predictions: ${d.pred} (W=${Number(d.w).toFixed(2)})`,
    type: "annotation", format: "gff3",
    url: "data/" + d.file, color: d.color, height: 120,
    visibilityWindow: -1
  }));
  TRACKS = TRACKS_BEFORE.concat(TRACKS_EVIDENCE, denovoTracks);
}
function makeOptions(locus) {
  return {
    showTrackLabels: false,   // track labels off by default (they overlay track content); toggle via navbar "Track Labels"
    reference: {
      name: "$REF_NAME$",
      fastaURL: "data/genome.fa",
      indexURL: "data/genome.fa.fai",
      cytobandURL: "data/cytoband.txt"
    },
    locus: locus,
    tracks: TRACKS
  };
}
async function initBrowser() {
  // try whole-genome view first, fall back to the first chromosome
  try {
    browser = await igv.createBrowser(document.getElementById("igv-div"), makeOptions("all"));
  } catch (e) {
    console.warn("whole-genome locus failed, fall back to first chromosome:", e);
    browser = await igv.createBrowser(document.getElementById("igv-div"),
      makeOptions("$FALLBACK_LOCUS$"));
  }
  setStatus("Ready: click a gene on the left or use search; scroll to zoom, drag to pan.");
}
async function loadGenes() {
  const resp = await fetch("data/genes.json");
  genes = await resp.json();
  for (const g of genes) geneMap.set(g.gene, g);
  // datalist
  const dl = document.getElementById("gene-datalist");
  for (const g of genes) {
    const opt = document.createElement("option");
    opt.value = g.gene;
    dl.appendChild(opt);
  }
  renderTable("");
  const nTx = genes.reduce((n, g) => n + (g.isoforms || []).length, 0);
  document.getElementById("count-info").textContent =
    `${genes.length} genes / ${nTx} transcripts: strong ${genes.filter(g => g.tier === "strong").length} / ` +
    `moderate ${genes.filter(g => g.tier === "moderate").length} / ` +
    `weak ${genes.filter(g => g.tier === "weak").length}`;
}
function sortGenes(list) {
  let cmp;
  if (sortMode === "name") {
    cmp = (a, b) => gidNum(a.gene) - gidNum(b.gene) ||
                   a.gene.localeCompare(b.gene);
  } else if (sortMode === "coord") {
    cmp = (a, b) =>
      (chromOrder.get(a.seqid) ?? 999) - (chromOrder.get(b.seqid) ?? 999) ||
      a.start - b.start;
  } else {
    // gff order (default)
    cmp = (a, b) => (a.gff_order ?? 1e9) - (b.gff_order ?? 1e9);
  }
  const sorted = list.slice().sort(cmp);
  return sortDir === "desc" ? sorted.reverse() : sorted;
}
function renderTable(keyword) {
  const kw = keyword.trim().toLowerCase();
  const tbody = document.getElementById("gene-tbody");
  tbody.innerHTML = "";
  // one row per transcript: same gene id repeated, per-transcript metrics
  let pool = [];
  for (const g of genes) {
    if (fltChr && g.seqid !== fltChr) continue;
    for (const t of (g.isoforms || [])) {
      if (currentTier !== "all" && t.tier !== currentTier) continue;
      const rv = parseFloat(t.rna) || 0;
      if (fltRna === "hi" && rv < 0.8) continue;
      if (fltRna === "mid" && (rv < 0.5 || rv >= 0.8)) continue;
      if (fltRna === "lo" && rv >= 0.5) continue;
      const pv = parseFloat(t.prot) || 0;
      if (fltProt === "hi" && pv < 0.8) continue;
      if (fltProt === "mid" && (pv < 0.5 || pv >= 0.8)) continue;
      if (fltProt === "lo" && pv >= 0.5) continue;
      if (fltGold === "yes" && t.gold !== "yes") continue;
      if (fltGold === "no" && t.gold === "yes") continue;
      pool.push({ g, t });
    }
  }
  const totalInPool = pool.length;
  // sort: gene-level key first, then transcript start
  pool.sort((a, b) => {
    if (sortMode === "name") {
      return gidNum(a.g.gene) - gidNum(b.g.gene) ||
             a.g.gene.localeCompare(b.g.gene) || a.t.start - b.t.start;
    }
    if (sortMode === "coord") {
      return (chromOrder.get(a.g.seqid) ?? 999) - (chromOrder.get(b.g.seqid) ?? 999) ||
             a.t.start - b.t.start;
    }
    return (a.g.gff_order ?? 1e9) - (b.g.gff_order ?? 1e9) || a.t.start - b.t.start;
  });
  if (sortDir === "desc") pool.reverse();
  let shown = 0;
  const frag = document.createDocumentFragment();
  for (const { g, t } of pool) {
    if (kw && !g.gene.toLowerCase().includes(kw) &&
        !t.tid.toLowerCase().includes(kw) &&
        !g.locus.toLowerCase().includes(kw)) continue;
    if (shown >= 800) break;
    shown++;
    const rnaCls = parseFloat(t.rna) < 0.5 ? "score-low" : "";
    const protCls = parseFloat(t.prot) < 0.5 ? "score-low" : "";
    const tr = document.createElement("tr");
    tr.dataset.gene = g.gene;
    tr.title = `${t.tid}  ${g.seqid}:${t.start}-${t.end} (${g.strand})` +
      `  locus coverage ${t.cov}  depth ~${t.depth}x` +
      `  RNA basis: ${t.rna_basis} (${t.rna_reached})` +
      `  protein basis: ${t.prot_basis} (${t.prot_reached})` +
      (t.marks ? `  flags: ${t.marks}` : "");
    tr.innerHTML =
      `<td>${g.gene}</td>` +
      `<td>${t.tid}</td>` +
      `<td><span class="badge b-${t.tier}">${t.tier}</span></td>` +
      `<td class="${rnaCls}" title="RNA support: ${t.rna_basis}">${t.rna}</td>` +
      `<td class="${protCls}" title="Protein support: ${t.prot_basis}">${t.prot}</td>` +
      `<td class="${t.gold === "yes" ? "gs-yes" : "gs-no"}" title="GoldSet origin">${t.gold === "yes" ? "✓" : "·"}</td>`;
    tr.addEventListener("click", () => jumpToGene(g.gene));
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
  document.getElementById("list-info").textContent =
    `showing ${shown} of ${totalInPool} transcripts${fltChr ? " on " + fltChr : ""}` +
    `${shown >= 800 ? " (max reached, narrow down with search/filter)" : ""}`;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function renderDetail(g) {
  // one full-width row per de novo predictor (scales to any predictor count)
  const denovoRows = denovoMeta.map(d => {
    const frac = (g.denovo && g.denovo[d.pred] !== undefined) ? g.denovo[d.pred] : 0;
    return `<div class="ev-row" title="fraction of transcript CDS covered by ${esc(d.pred)} predictions (UTRs excluded)">` +
           `<span class="ev-bar" style="width:${Math.round(frac * 80)}px;background:${d.color}"></span>` +
           `<span class="ev-name">${esc(d.pred)}</span>` +
           `<span class="ev-w">W=${Number(d.w).toFixed(2)}</span>` +
           `<span class="ev-val">${frac.toFixed(2)}</span></div>`;
  }).join("");
  // per-transcript cards: each transcript's own metrics
  const txCards = (g.isoforms || []).map(t => {
    const tmarks = t.marks ? t.marks.split(",").map(m =>
      `<span class="mb">${esc(m)}</span>`).join(" ") : "";
    const rnaCls = parseFloat(t.rna) < 0.5 ? "score-low" : "";
    const protCls = parseFloat(t.prot) < 0.5 ? "score-low" : "";
    // per-transcript de novo support, one predictor per line
    const tdn = (t.denovo && denovoMeta.length) ? denovoMeta.map(d => {
      const frac = t.denovo[d.pred] !== undefined ? t.denovo[d.pred] : 0;
      return `<span class="ev-bar" style="width:${Math.round(frac * 40)}px;background:${d.color}"></span>` +
             `${esc(d.pred)} <span class="dim">W=${Number(d.w).toFixed(2)}</span> <b>${frac.toFixed(2)}</b>`;
    }).join("<br>") : "";
    return `<div class="tx-card">
      <div class="tx-head"><span class="tx-id">${esc(t.tid)}</span>` +
        `<span class="tx-loc">${esc(g.seqid)}:${t.start}-${t.end} (${(t.end - t.start + 1).toLocaleString()} bp)</span>` +
        `<span class="badge b-${t.tier}">${t.tier}</span>` +
        (t.gold === "yes" ? '<span class="gs-yes" title="GoldSet origin">GoldSet ✓</span>' : "") +
      `</div>
      <div class="tx-grid">
        <span class="k">RNA support</span><span class="v ${rnaCls}">${t.rna} <span class="dim">(basis: ${esc(t.rna_basis || "-")}, ${t.rna_reached})</span></span>
        <span class="k">Protein support</span><span class="v ${protCls}">${t.prot} <span class="dim">(basis: ${esc(t.prot_basis || "-")}, ${t.prot_reached})</span></span>
        <span class="k">CDS / Exons</span><span class="v">${t.cds} CDS / ${t.exon} exons</span>
        ${tdn ? `<span class="k">De novo (CDS)</span><span class="v">${tdn}</span>` : ""}
        <span class="k">Locus coverage</span><span class="v">${t.cov} <span class="dim">depth ~${t.depth}x</span></span>
        ${tmarks ? `<span class="k">Flags</span><span class="v">${tmarks}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  const marks = g.marks ? g.marks.split(",").map(m => `<span class="mb">${esc(m)}</span>`).join(" ") : "";
  const markDesc = [g.flag_desc, g.note_desc].filter(Boolean).join("; ");
  document.getElementById("detail-head").textContent = `Gene detail — ${g.gene}`;
  document.getElementById("gene-detail").innerHTML = `
    <div class="dt-section">
      <div class="dt-title">Overview</div>
      <div class="dt-grid">
        <span class="k">Gene ID</span><span class="v">${esc(g.gene)}</span>
        <span class="k">Locus</span><span class="v">${esc(g.locus)} (${g.strand})</span>
        <span class="k">Overall tier</span><span class="v"><span class="badge b-${g.tier}">${g.tier}</span></span>
        <span class="k">GoldSet origin</span><span class="v ${g.goldset === "yes" ? "gs-yes" : "gs-no"}">${g.goldset === "yes" ? "yes" : "no"}</span>
      </div>
    </div>
    <div class="dt-section">
      <div class="dt-title">Gene list indicators</div>
      <div class="dt-grid">
        <span class="k">Transcripts</span><span class="v">${g.tx}</span>
        <span class="k">RNA</span><span class="v">${g.rna}</span>
        <span class="k">Protein</span><span class="v">${g.prot}</span>
        <span class="k">GoldSet</span><span class="v ${g.goldset === "yes" ? "gs-yes" : "gs-no"}">${g.goldset === "yes" ? "yes ✓" : "no"}</span>
        <span class="k">Flags</span><span class="v">${marks || '<span class="dt-empty">none</span>'}</span>
      </div>
    </div>
    <div class="dt-section">
      <div class="dt-title">Structure (from final GFF3)</div>
      <div class="dt-grid">
        <span class="k">Transcripts</span><span class="v">${g.tx}</span>
        <span class="k">CDS</span><span class="v">${g.cds}</span>
        <span class="k">Exons</span><span class="v">${g.exon}</span>
        <span class="k">Length</span><span class="v">${(g.end - g.start + 1).toLocaleString()} bp</span>
      </div>
    </div>
    <div class="dt-section">
      <div class="dt-title">Transcripts (${(g.isoforms || []).length}) — per-transcript metrics</div>
      ${txCards || '<span class="dt-empty">no transcript records</span>'}
    </div>
    <div class="dt-section">
      <div class="dt-title">De novo evidence — CDS coverage</div>
      ${denovoRows || '<span class="dt-empty">no de novo predictors</span>'}
    </div>
    ${marks || markDesc ? `<div class="dt-section"><div class="dt-title">Flags / notes</div><div>${marks}${markDesc ? `<div class="warn-line">${esc(markDesc)}</div>` : ""}</div></div>` : ""}
  `;
}
function jumpToGene(gid) {
  const g = geneMap.get(gid);
  if (!g || !browser) return;
  browser.search(g.locus);
  document.querySelectorAll("#gene-tbody tr.current").forEach(tr => tr.classList.remove("current"));
  const tr = document.querySelector(`#gene-tbody tr[data-gene="${gid}"]`);
  if (tr) { tr.classList.add("current"); tr.scrollIntoView({ block: "nearest" }); }
  renderDetail(g);
  setStatus(`Jumped to ${g.gene}  (${g.locus}, ${g.tier}, transcripts=${g.tx})`);
}
async function loadChroms() {
  const resp = await fetch("data/genome.fa.fai");
  const text = await resp.text();
  const fsel = document.getElementById("flt-chr");
  fsel.innerHTML = '<option value="">All chromosomes</option>';
  let idx = 0;
  for (const line of text.trim().split("\n")) {
    const [name, len] = line.split("\t");
    chromOrder.set(name, idx++);
    const fopt = document.createElement("option");
    fopt.value = name;
    fopt.textContent = name;
    fsel.appendChild(fopt);
  }
  fsel.addEventListener("change", () => {
    fltChr = fsel.value;
    renderTable(document.getElementById("gene-search").value);
    if (fsel.value && browser) {
      browser.search(fsel.value);
      setStatus("Jumped by locus: " + fsel.value);
    }
  });
  document.getElementById("flt-sort").addEventListener("change", (e) => {
    sortMode = e.target.value;
    renderTable(document.getElementById("gene-search").value);
  });
  document.getElementById("flt-dir").addEventListener("change", (e) => {
    sortDir = e.target.value;
    renderTable(document.getElementById("gene-search").value);
  });
}
document.getElementById("gene-search").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  if (geneMap.has(q)) { jumpToGene(q); return; }
  // transcript id -> its gene
  const base = q.replace(/\.\d+$/, "");
  if (geneMap.has(base)) { jumpToGene(base); return; }
  // treat input as a locus
  if (browser) { browser.search(q); setStatus("Jumped by locus: " + q); }
});
document.getElementById("gene-search").addEventListener("input", (e) => {
  renderTable(e.target.value);
});
function bindFilter(id, setter) {
  document.getElementById(id).addEventListener("change", (e) => {
    setter(e.target.value);
    renderTable(document.getElementById("gene-search").value);
  });
}
bindFilter("flt-tier", v => currentTier = v);
bindFilter("flt-rna", v => fltRna = v);
bindFilter("flt-prot", v => fltProt = v);
bindFilter("flt-gold", v => fltGold = v);
document.getElementById("side-toggle").addEventListener("click", () => {
  document.body.classList.toggle("side-collapsed");
  const collapsed = document.body.classList.contains("side-collapsed");
  const btn = document.getElementById("side-toggle");
  btn.textContent = collapsed ? "☰ Gene list" : "☰ Hide gene list";
  btn.classList.toggle("active", !collapsed);
  // notify igv to recompute viewport after panel width change
  setTimeout(() => window.dispatchEvent(new Event("resize")), 50);
});
(async () => {
  try {
    await Promise.all([loadGenes(), loadChroms(), loadDenovoTracks()]);
    await initBrowser();
  } catch (err) {
    setStatus("Loading failed: " + err.message);
    console.error(err);
  }
})();
</script>
</body>
</html>
