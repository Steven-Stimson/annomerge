<svg xmlns="http://www.w3.org/2000/svg" width="2248" height="1306" viewBox="-48 -48 2247.111 1306" style="background-color: #FFFFFF"><rect x="-48" y="-48" width="2247.111" height="1306" fill="#FFFFFF"/><title>AnnoMerge Workflow</title><desc>AnnoMerge workflow from genome and evidence inputs through evidence collection, predictor scoring, EVM integration, optional augmentation, confidence tiering, and final deliverables.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#334155}.phase{stroke-width:1.7}.phase-title{font-size:22px;font-weight:700;text-anchor:start}.lane-title{font-size:18px;font-weight:700;fill:#fff;text-anchor:middle}.step{font-size:15px;text-anchor:middle}.small{font-size:13px;text-anchor:middle}.tiny{font-size:12px;text-anchor:middle}.card{fill:#fff;stroke-width:1.4}.note{font-size:12.5px;fill:#64748b}</style><linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ef4444"/><stop offset="16.67%" stop-color="#f97316"/><stop offset="33.33%" stop-color="#eab308"/><stop offset="50%" stop-color="#22c55e"/><stop offset="66.67%" stop-color="#3b82f6"/><stop offset="83.33%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#9333ea"/></linearGradient><marker id="tip-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="tip-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f97316"/></marker><marker id="tip-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker></defs><rect x="545" y="24" width="1060" height="58" rx="9" fill="url(#title-gradient)"/><text x="1075" y="62" fill="#fff" style="fill:#fff" font-size="30" font-weight="700" text-anchor="middle">AnnoMerge Workflow</text><g id="phase-inputs"><rect x="80" y="101" width="1990" height="78" rx="11" fill="#fff1f2" stroke="#ef4444" class="phase"/><rect x="98" y="116" width="220" height="48" rx="5" fill="#fecdd3"/><text x="118" y="147" class="phase-title" style="fill:#9f1239">Inputs</text><g class="card" stroke="#ef4444"><rect x="342" y="119" width="245" height="42" rx="6"/><rect x="602" y="119" width="245" height="42" rx="6"/><rect x="862" y="119" width="245" height="42" rx="6"/><rect x="1122" y="119" width="225" height="42" rx="6"/><rect x="1362" y="119" width="260" height="42" rx="6"/><rect x="1637" y="119" width="405" height="42" rx="6"/></g><g class="step"><text x="464" y="146">Genome FASTA</text><text x="724" y="146">De novo predictions</text><text x="984" y="146">Homolog proteins</text><text x="1234" y="146">RNA-seq</text><text x="1492" y="146">BUSCO lineage</text><text x="1839" y="146">OMAmer DB</text></g></g><path d="M1066 187H1084V193H1096L1075 205L1054 193H1066Z" fill="#475569"/><g id="phase-evidence"><rect x="80" y="213" width="1990" height="237" rx="11" fill="#fff7ed" stroke="#f97316" class="phase"/><rect x="98" y="230" width="220" height="203" rx="5" fill="#fed7aa"/><text x="118" y="287" class="phase-title" style="fill:#9a3412">Evidence</text><text x="118" y="316" class="phase-title" style="fill:#9a3412">Collection</text><rect x="342" y="230" width="700" height="32" rx="5" fill="#f97316"/><rect x="1062" y="230" width="980" height="32" rx="5" fill="#ea580c"/><text x="692" y="252" class="lane-title">RNA branch</text><text x="1552" y="252" class="lane-title">Homolog branch</text><g class="card" stroke="#f97316"><rect x="342" y="276" width="315" height="54" rx="6"/><rect x="707" y="276" width="335" height="54" rx="6"/></g><text x="499" y="298" class="step"><tspan x="499">HISAT2 or minimap2</tspan><tspan x="499" dy="19">RNA-seq alignment</tspan></text><text x="874" y="298" class="step"><tspan x="874">StringTie</tspan><tspan x="874" dy="19">transcript assembly</tspan></text><path d="M657 303H698" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#tip-blue)"/><g class="card" stroke="#ea580c"><rect x="1062" y="276" width="980" height="54" rx="6"/></g><text x="1552" y="298" class="step"><tspan x="1552">miniprot</tspan><tspan x="1552" dy="19">protein-to-genome alignment</tspan></text><path d="M874 334V344H640V372" fill="none" stroke="#f97316" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#tip-blue)"/><path d="M1552 334V344H820V372" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#tip-green)"/><rect x="342" y="350" width="1700" height="82" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.4"/><text x="360" y="373" font-size="16" font-weight="700" text-anchor="start" style="fill:#c2410c">Gold set — RNA and homolog evidence converge</text><g class="card" stroke="#f97316"><rect x="360" y="383" width="390" height="36" rx="5"/><rect x="795" y="383" width="390" height="36" rx="5"/><rect x="1230" y="383" width="390" height="36" rx="5"/><rect x="1665" y="383" width="354" height="36" rx="5"/></g><g class="small"><text x="555" y="406">RNA + homolog candidates</text><text x="990" y="406">TransDecoder ORFs</text><text x="1425" y="406">DIAMOND validation</text><text x="1842" y="406" font-weight="700">Validated gold set</text></g><path d="M750 401H786M1185 401H1221M1620 401H1656" fill="none" stroke="#f97316" stroke-width="1.8" marker-end="url(#tip-blue)"/></g><path d="M1066 458H1084V464H1096L1075 475L1054 464H1066Z" fill="#475569"/><g id="phase-scoring"><rect x="80" y="483" width="1990" height="151" rx="11" fill="#f0fdf4" stroke="#22c55e" class="phase"/><rect x="98" y="500" width="220" height="117" rx="5" fill="#dcfce7"/><text x="118" y="565" class="phase-title" style="fill:#166534">Scoring</text><g class="card" stroke="#22c55e"><rect x="342" y="500" width="395" height="70" rx="6"/><rect x="752" y="500" width="395" height="70" rx="6"/><rect x="1162" y="500" width="395" height="70" rx="6"/><rect x="1572" y="500" width="470" height="70" rx="6"/></g><g class="small"><text x="539" y="523" font-size="20" font-weight="700">R_s</text><text x="539" y="546"><tspan x="539">RNA support</tspan><tspan x="539" dy="16">from aligned transcripts</tspan></text><text x="949" y="523" font-size="20" font-weight="700">H_s</text><text x="949" y="546"><tspan x="949">Homolog support</tspan><tspan x="949" dy="16">from protein alignments</tspan></text><text x="1359" y="523" font-size="20" font-weight="700">B_s</text><text x="1359" y="546"><tspan x="1359">BUSCO completeness</tspan><tspan x="1359" dy="16">against selected lineage</tspan></text><text x="1807" y="523" font-size="20" font-weight="700">O_s</text><text x="1807" y="546"><tspan x="1807">OMArk consistency</tspan><tspan x="1807" dy="16">using the OMAmer DB</tspan></text></g><rect x="342" y="582" width="1700" height="35" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="1192" y="604" class="small" font-weight="700">P = weighted sum of R_s, H_s, B_s + O_s</text></g><path d="M1066 642H1084V648H1096L1075 659L1054 648H1066Z" fill="#475569"/><g id="phase-integration"><rect x="80" y="667" width="1990" height="93" rx="11" fill="#eff6ff" stroke="#3b82f6" class="phase"/><rect x="98" y="681" width="220" height="65" rx="5" fill="#dbeafe"/><text x="118" y="706" class="phase-title" style="fill:#1d4ed8"><tspan x="118">Integration</tspan><tspan x="118" dy="24">&amp; Filtering</tspan></text><g fill="#fff" stroke="#3b82f6" stroke-width="1.4"><path d="M342 682H660L678 714L660 746H342Z"/><path d="M686 682H1053L1071 714L1053 746H686L704 714Z"/><path d="M1079 682H1510L1528 714L1510 746H1079L1097 714Z"/><path d="M1536 682H2024L2042 714L2024 746H1536L1554 714Z"/></g><g class="step"><text x="510" y="719" font-weight="700">P score</text><text x="879" y="719" font-weight="700">EVM weight mapping</text><text x="1303" y="706" font-weight="700">EVidenceModeler</text><text x="1303" y="724" font-size="12">integration of all evidence</text><text x="1789" y="698" font-weight="700">Sanity filter</text><text x="1789" y="715" font-size="12">remove structural errors</text><text x="1789" y="731" font-size="12">tag incomplete or ambiguous CDS</text></g></g><path d="M1066 768H1084V774H1096L1075 785L1054 774H1066Z" fill="#475569"/><text x="1112" y="781" class="note" text-anchor="start">optional augment path</text><g id="phase-augment"><rect x="80" y="793" width="1990" height="93" rx="11" fill="#eef2ff" stroke="#4f46e5" class="phase" stroke-dasharray="7 5"/><rect x="98" y="807" width="300" height="65" rx="5" fill="#e0e7ff"/><text x="118" y="846" class="phase-title" style="fill:#3730a3">Augment</text><g class="card" stroke="#4f46e5"><rect x="425" y="807" width="795" height="65" rx="6"/><rect x="1240" y="807" width="802" height="65" rx="6"/></g><g class="step"><text x="822.5" y="837" font-weight="700">AS rescue</text><text x="822.5" y="857" font-size="12">recover supported isoforms</text><text x="1641" y="837" font-weight="700">UTR backfill</text><text x="1641" y="857" font-size="12">extend transcript boundaries</text></g></g><path d="M1066 894H1084V900H1096L1075 912L1054 900H1066Z" fill="#475569"/><g id="phase-deliverables"><rect x="80" y="920" width="1990" height="170" rx="11" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/><rect x="98" y="937" width="390" height="135" rx="6" fill="#f3e8ff"/><text x="118" y="970" class="phase-title" style="fill:#6b21a8;font-size:21px"><tspan x="118">Confidence tiering</tspan><tspan x="118" dy="27">&amp; deliverables</tspan></text><text x="520" y="951" font-size="16" font-weight="700" text-anchor="start" style="fill:#6b21a8">Confidence tiers</text><g class="card" stroke="#9333ea"><rect x="515" y="961" width="220" height="40" rx="6"/><rect x="750" y="961" width="220" height="40" rx="6"/><rect x="985" y="961" width="220" height="40" rx="6"/><rect x="1220" y="961" width="822" height="40" rx="6"/></g><g class="step"><text x="625" y="987" font-weight="700">Strong</text><text x="860" y="987" font-weight="700">Moderate</text><text x="1095" y="987" font-weight="700">Weak</text><text x="1631" y="987">Evidence support tags attached per transcript</text></g><text x="520" y="1024" font-size="16" font-weight="700" text-anchor="start" style="fill:#6b21a8">Deliverables</text><g class="card" stroke="#9333ea"><rect x="515" y="1034" width="499" height="38" rx="6"/><rect x="1029" y="1034" width="499" height="38" rx="6"/><rect x="1543" y="1034" width="499" height="38" rx="6"/></g><g class="step" font-weight="700"><text x="764.5" y="1059">HTML report</text><text x="1278.5" y="1059">Interactive evidence browser</text><text x="1792.5" y="1059">Final GFF3</text></g></g></svg>