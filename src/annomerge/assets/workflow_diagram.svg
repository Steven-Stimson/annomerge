<svg xmlns="http://www.w3.org/2000/svg" width="2248" height="1306" viewBox="-48 -48 2247.111 1306" style="background-color: #FFFFFF"><rect x="-48" y="-48" width="2247.111" height="1306" fill="#FFFFFF"/><title>AnnoMerge Workflow</title><desc>AnnoMerge workflow from genome and evidence inputs through evidence collection, adaptive scoring, EVM integration, optional augmentation, confidence tiering, and final deliverables.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#334155}.phase{stroke-width:1.7;stroke-dasharray:7 5}.phase-title{font-size:22px;font-weight:700;text-anchor:start}.lane-title{font-size:18px;font-weight:700;fill:#fff;text-anchor:middle}.step{font-size:15px;text-anchor:middle}.small{font-size:13px;text-anchor:middle}.tiny{font-size:12px;text-anchor:middle}.card{fill:#fff;stroke-width:1.4}.mode-title{font-size:17px;font-weight:700;text-anchor:start}.mode-step{font-size:11.5px;text-anchor:middle}.note{font-size:12.5px;fill:#64748b}</style><marker id="tip-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="tip-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4a90e2"/></marker><marker id="tip-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70ad47"/></marker><marker id="tip-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b59b6"/></marker><marker id="tip-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e67e22"/></marker></defs><rect x="545" y="24" width="1060" height="58" rx="9" fill="#4a90e2"/><text x="1075" y="62" fill="#fff" style="fill:#fff" font-size="30" font-weight="700" text-anchor="middle">AnnoMerge Workflow</text><g id="phase-inputs"><rect x="80" y="101" width="1990" height="78" rx="11" fill="#f0f7ff" stroke="#4a90e2" class="phase"/><g><rect x="98" y="116" width="220" height="48" rx="5" fill="#bcd4ef"/><text x="118" y="147" class="phase-title" text-anchor="start" style="fill:#1f3a63">01  Inputs</text></g><g class="card" stroke="#4a90e2"><rect x="342" y="119" width="245" height="42" rx="6"/><rect x="602" y="119" width="245" height="42" rx="6"/><rect x="862" y="119" width="245" height="42" rx="6"/><rect x="1122" y="119" width="225" height="42" rx="6"/><rect x="1362" y="119" width="260" height="42" rx="6"/><rect x="1637" y="119" width="405" height="42" rx="6"/></g><g class="step"><text x="464" y="146">Genome FASTA</text><text x="724" y="146">De novo predictions</text><text x="984" y="146">Homolog proteins</text><text x="1234" y="146">RNA-seq</text><text x="1492" y="146">BUSCO lineage</text><text x="1839" y="146">OMAmer DB</text></g></g><path d="M1065 184H1085V194H1098L1075 210L1052 194H1065Z" fill="#475569"/><g id="phase-evidence"><rect x="80" y="213" width="1990" height="237" rx="11" fill="#f4faf4" stroke="#70ad47" class="phase"/><g><rect x="98" y="230" width="220" height="203" rx="5" fill="#c9e6cb"/><text x="118" y="272" class="phase-title" text-anchor="start" style="fill:#2d572c"><tspan x="118">02  Evidence</tspan><tspan x="118" dy="29">Collection</tspan></text><text x="118" y="348" font-size="13" text-anchor="start" style="fill:#486847"><tspan x="118">Three evidence branches</tspan><tspan x="118" dy="19">plus convergent</tspan><tspan x="118" dy="19">gold-set construction</tspan></text></g><rect x="342" y="230" width="480" height="32" rx="5" fill="#4a90e2"/><rect x="842" y="230" width="550" height="32" rx="5" fill="#70ad47"/><rect x="1412" y="230" width="630" height="32" rx="5" fill="#f39c12"/><text x="582" y="252" class="lane-title">RNA branch</text><text x="1117" y="252" class="lane-title">Homolog branch</text><text x="1727" y="252" class="lane-title">Database branch</text><path d="M554 303H575M1014 303H1025M1191 303H1202" fill="none" stroke-width="2"/><path d="M554 303H575" fill="none" stroke="#4a90e2" stroke-width="2" marker-end="url(#tip-blue)"/><path d="M1014 303H1025M1191 303H1202" fill="none" stroke="#70ad47" stroke-width="2" marker-end="url(#tip-green)"/><g class="card" stroke="#4a90e2"><rect x="342" y="276" width="205" height="54" rx="6"/><rect x="584" y="276" width="238" height="54" rx="6"/></g><g class="step"><text x="444" y="298"><tspan x="444">HISAT2</tspan><tspan x="444" dy="19">alignment</tspan></text><text x="703" y="298"><tspan x="703">StringTie</tspan><tspan x="703" dy="19">assembly</tspan></text></g><g class="card" stroke="#70ad47"><rect x="842" y="276" width="165" height="54" rx="6"/><rect x="1034" y="276" width="150" height="54" rx="6"/><rect x="1211" y="276" width="181" height="54" rx="6"/></g><g class="step"><text x="924" y="298"><tspan x="924">miniprot</tspan><tspan x="924" dy="19">alignment</tspan></text><text x="1109" y="308">mnp filter</text><text x="1301" y="298"><tspan x="1301">referee</tspan><tspan x="1301" dy="19">protein set</tspan></text></g><g class="card" stroke="#f39c12"><rect x="1412" y="276" width="255" height="54" rx="6"/><rect x="1694" y="276" width="348" height="54" rx="6"/></g><text x="1539" y="308" class="step">BUSCO lineage</text><text x="1868" y="298" class="step"><tspan x="1868">OMArk</tspan><tspan x="1868" dy="19">(OMAmer DB)</tspan></text><path d="M703 333V342H455V379" fill="none" stroke="#4a90e2" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#tip-blue)"/><path d="M1301 333V341H923V379" fill="none" stroke="#70ad47" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#tip-green)"/><g><rect x="342" y="350" width="1050" height="82" rx="8" fill="#eef6ff" stroke="#4a90e2" stroke-width="1.4"/><text x="360" y="373" font-size="16" font-weight="700" text-anchor="start" style="fill:#1f5f9d">Gold set — converges RNA and homolog evidence</text><path d="M552 401H564M760 401H772M1068 401H1080" fill="none" stroke="#4a90e2" stroke-width="1.8" marker-end="url(#tip-blue)"/><g class="card" stroke="#4a90e2"><rect x="360" y="383" width="190" height="36" rx="5"/><rect x="573" y="383" width="185" height="36" rx="5"/><rect x="781" y="383" width="285" height="36" rx="5"/><rect x="1089" y="383" width="280" height="36" rx="5"/></g><g class="small"><text x="455" y="406">StringTie transcripts</text><text x="665" y="406">TransDecoder ORFs</text><text x="923" y="398"><tspan x="923">DIAMOND validation</tspan><tspan x="923" dy="15">vs referee proteins</tspan></text><text x="1229" y="406" font-weight="700">Gold set</text></g></g></g><path d="M1065 454H1085V464H1098L1075 480L1052 464H1065Z" fill="#475569"/><g id="phase-scoring"><rect x="80" y="483" width="1990" height="151" rx="11" fill="#fffaf2" stroke="#f39c12" class="phase"/><g><rect x="98" y="500" width="220" height="117" rx="5" fill="#fdf2d0"/><text x="118" y="535" class="phase-title" text-anchor="start" style="fill:#7d4e08">03  Scoring</text><text x="118" y="563" font-size="13" text-anchor="start" style="fill:#7d4e08"><tspan x="118">Per de novo predictor</tspan><tspan x="118" dy="19">P = weighted sum</tspan><tspan x="118" dy="19">of available sub-scores</tspan></text></g><g class="card" stroke="#d99b50"><rect x="342" y="500" width="315" height="70" rx="6"/><rect x="673" y="500" width="315" height="70" rx="6"/><rect x="1004" y="500" width="315" height="70" rx="6"/><rect x="1335" y="500" width="315" height="70" rx="6"/><rect x="1666" y="500" width="376" height="70" rx="6"/></g><g class="small"><text x="499" y="521" font-size="20" font-weight="700">R_s</text><text x="499" y="540" font-size="11"><tspan x="499">RNA support: junctions,</tspan><tspan x="499" dy="14">exon precision,</tspan><tspan x="499" dy="14">single-exon bias</tspan></text><text x="830" y="521" font-size="20" font-weight="700">H_s</text><text x="830" y="540" font-size="11"><tspan x="830">Full-length hits vs</tspan><tspan x="830" dy="14">referee proteins</tspan><tspan x="830" dy="14">and gold set</tspan></text><text x="1161" y="521" font-size="20" font-weight="700">B_c</text><text x="1161" y="540" font-size="11"><tspan x="1161">BUSCO complete recall</tspan><tspan x="1161" dy="14">from BUSCO lineage</tspan></text><text x="1492" y="521" font-size="20" font-weight="700">O_s</text><text x="1492" y="540" font-size="11"><tspan x="1492">OMArk consistent</tspan><tspan x="1492" dy="14">fraction from</tspan><tspan x="1492" dy="14">OMAmer DB</tspan></text><text x="1854" y="521" font-size="20" font-weight="700">C_s</text><text x="1854" y="540" font-size="11"><tspan x="1854">1 − structural</tspan><tspan x="1854" dy="14">anomaly rate from</tspan><tspan x="1854" dy="14">homolog-hit heuristics</tspan></text></g><rect x="342" y="582" width="1700" height="35" rx="5" fill="#fff3dd" stroke="#d99b50"/><text x="1192" y="604" class="small"><tspan x="1192">Missing sub-scores are skipped with weight renormalization; </tspan><tspan font-weight="700">--weight-mode adaptive</tspan><tspan> additionally scales B_c / O_s by informative coverage.</tspan></text></g><path d="M1065 638H1085V648H1098L1075 664L1052 648H1065Z" fill="#475569"/><g id="phase-integration"><rect x="80" y="667" width="1990" height="83" rx="11" fill="#f0f7ff" stroke="#4a90e2" class="phase"/><g><rect x="98" y="681" width="220" height="55" rx="5" fill="#bcd4ef"/><text x="118" y="705" class="phase-title" text-anchor="start" style="fill:#1f3a63"><tspan x="118">04  Integration</tspan><tspan x="118" dy="24">&amp; Filtering</tspan></text></g><g fill="#fff" stroke="#4a90e2" stroke-width="1.4"><path d="M342 682H628L646 709L628 736H342Z"/><path d="M654 682H960L978 709L960 736H654L672 709Z"/><path d="M986 682H1455L1473 709L1455 736H986L1004 709Z"/><path d="M1481 682H2024L2042 709L2024 736H1481L1499 709Z"/></g><g class="step" font-weight="700"><text x="494" y="714">P score</text><text x="816" y="714">EVM weight mapping</text><text x="1229" y="704"><tspan x="1229">EVM integration</tspan><tspan x="1229" dy="18" font-size="12" font-weight="400">predictions + StringTie + miniprot + gold set</tspan></text><text x="1761" y="704"><tspan x="1761">Sanity filter</tspan><tspan x="1761" dy="18">+ ID normalization</tspan></text></g></g><path d="M1065 754H1085V764H1098L1075 780L1052 764H1065Z" fill="#475569"/><text x="1108" y="769" class="note" text-anchor="start">optional --augment</text><g id="phase-augment"><rect x="80" y="783" width="1990" height="83" rx="11" fill="#fcf5ff" stroke="#9b59b6" class="phase"/><g><rect x="98" y="797" width="300" height="55" rx="5" fill="#e8d1f0"/><text x="118" y="831" class="phase-title" text-anchor="start" style="fill:#5c2a6d">05  Augment (optional)</text></g><g class="card" stroke="#9b59b6"><rect x="425" y="799" width="410" height="51" rx="6"/><rect x="865" y="799" width="390" height="51" rx="6"/><rect x="1285" y="799" width="757" height="51" rx="6"/></g><text x="630" y="829" class="step">Isoform resolution</text><text x="1060" y="829" class="step">UTR backfill</text><text x="1663" y="820" class="step"><tspan x="1663">Near-duplicate UTR-donor removal</tspan><tspan x="1663" dy="18">(--aug-dedup: geometric or evidence)</tspan></text></g><path d="M520 870V886" fill="none" stroke="#9b59b6" stroke-width="2" marker-end="url(#tip-purple)"/><path d="M1580 870V886" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#tip-orange)"/><g id="geometric-mode"><rect x="80" y="892" width="950" height="147" rx="11" fill="#f5f3ff" stroke="#9b59b6" class="phase"/><g><rect x="98" y="905" width="914" height="31" rx="5" fill="#e8d1f0"/><text x="118" y="927" class="mode-title" text-anchor="start" style="fill:#5c2a6d">Geometric mode (default)</text></g><g fill="#fff" stroke="#9b59b6" stroke-width="1.3"><path d="M98 951H285L299 989L285 1027H98Z"/><path d="M304 951H505L519 989L505 1027H304L318 989Z"/><path d="M524 951H777L791 989L777 1027H524L538 989Z"/><path d="M796 951H998L1012 989L998 1027H796L810 989Z"/></g><g class="mode-step"><text x="198" y="981"><tspan x="198">UTR donor</tspan><tspan x="198" dy="16">extraction</tspan></text><text x="411" y="973"><tspan x="411">±jitter</tspan><tspan x="411" dy="16">span</tspan><tspan x="411" dy="16">clustering</tspan></text><text x="657" y="965"><tspan x="657">Representative</tspan><tspan x="657" dy="16">selection</tspan><tspan x="657" dy="16">(longest UTR)</tspan></text><text x="904" y="973"><tspan x="904">Identical-intron-</tspan><tspan x="904" dy="16">chain</tspan><tspan x="904" dy="16">collapse</tspan></text></g></g><g id="evidence-mode"><rect x="1050" y="892" width="1020" height="147" rx="11" fill="#fff7ed" stroke="#e67e22" class="phase"/><g><rect x="1068" y="905" width="984" height="31" rx="5" fill="#fbead1"/><text x="1088" y="927" class="mode-title" text-anchor="start" style="fill:#7d4e08">Evidence mode</text></g><g fill="#fff" stroke="#e67e22" stroke-width="1.3"><path d="M1068 951H1238L1252 989L1238 1027H1068Z"/><path d="M1257 951H1424L1438 989L1424 1027H1257L1271 989Z"/><path d="M1443 951H1643L1657 989L1643 1027H1443L1457 989Z"/><path d="M1662 951H1822L1836 989L1822 1027H1662L1676 989Z"/><path d="M1841 951H2038L2052 989L2038 1027H1841L1855 989Z"/></g><g class="mode-step"><text x="1160" y="981"><tspan x="1160">UTR donor</tspan><tspan x="1160" dy="16">extraction</tspan></text><text x="1347" y="981"><tspan x="1347">Splice-PWM</tspan><tspan x="1347" dy="16">gate</tspan></text><text x="1550" y="973"><tspan x="1550">Junction-read</tspan><tspan x="1550" dy="16">corroboration</tspan></text><text x="1749" y="981"><tspan x="1749">TPM-ratio</tspan><tspan x="1749" dy="16">filter</tspan></text><text x="1947" y="973"><tspan x="1947">Identical-intron-</tspan><tspan x="1947" dy="16">chain</tspan><tspan x="1947" dy="16">collapse</tspan></text></g></g><path d="M2050 710H2091V1074H2053" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tip-main)"/><text x="2114" y="890" font-size="13" text-anchor="middle" transform="rotate(90 2114 890)" style="fill:#64748b">bypass if --augment is not used</text><path d="M1075 1043V1057" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#tip-main)"/><g id="phase-deliverables"><rect x="80" y="1063" width="1990" height="124" rx="11" fill="#f4faf4" stroke="#70ad47" stroke-width="2"/><g><rect x="98" y="1080" width="390" height="89" rx="6" fill="#c9e6cb"/><text x="118" y="1112" class="phase-title" text-anchor="start" style="fill:#2d572c;font-size:21px"><tspan x="118">06  Confidence tiering</tspan><tspan x="118" dy="27">+ support tags</tspan></text></g><text x="520" y="1091" font-size="18" font-weight="700" text-anchor="start" style="fill:#2d572c">Deliverables</text><g class="card" stroke="#70ad47"><rect x="515" y="1102" width="280" height="47" rx="6"/><rect x="812" y="1102" width="300" height="47" rx="6"/><rect x="1129" y="1102" width="260" height="47" rx="6"/><rect x="1406" y="1102" width="636" height="47" rx="6"/></g><g class="step"><text x="655" y="1131">HTML report</text><text x="962" y="1131">Evidence browser</text><text x="1259" y="1131">Final GFF3</text><text x="1724" y="1131">Protein &amp; CDS sequences</text></g><text x="1278" y="1173" class="note" text-anchor="middle">Assessment report footnote: BUSCO and OMArk are re-run on the final annotation.</text></g></svg>