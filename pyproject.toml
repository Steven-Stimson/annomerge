[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "annomerge"
version = "0.1.0"
description = "Automated EVM weight calibration and evidence auditing for gene annotation in non-model organisms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "pandas",
    "numpy",
    "pysam",
    "gffutils",
    "jinja2",
]

[project.scripts]
annomerge = "annomerge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
